name: Build & Attach Firmware to Release

on:
  release:
    types: [created]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-gui-executables:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📦 Install dependencies
        run: |
          pip install pyinstaller pyserial esptool certifi matplotlib numpy pyperclipimg Pillow

      - name: 🏗️ Build esptool-gui with PyInstaller (Linux)
        if: runner.os == 'Linux'
        working-directory: tools/ESPTools-GUI
        run: |
          ESPTOOL_LOCATION=$(pip show esptool | grep '^Location: ' | cut -c11- | tr -d '\n')
          ESPTOOL_TARGETS_1="${ESPTOOL_LOCATION}/esptool/targets/stub_flasher/1/*.json:./esptool/targets/stub_flasher/1/"
          ESPTOOL_TARGETS_2="${ESPTOOL_LOCATION}/esptool/targets/stub_flasher/2/*.json:./esptool/targets/stub_flasher/2/"

          pyinstaller --onefile --windowed --name "esptool-gui" \
            --icon ESPTools-GUI.ico \
            --hidden-import serial.tools.list_ports \
            --hidden-import esptool \
            --hidden-import tkinter \
            --hidden-import tkinter.ttk \
            --hidden-import tkinter.scrolledtext \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            --add-data "./ESPTools-GUI.ico:." \
            --add-data "${ESPTOOL_TARGETS_1}" \
            --add-data "${ESPTOOL_TARGETS_2}" \
            esptool_gui.py
        shell: bash

      - name: 🏗️ Build calibration-helper-GUI with PyInstaller (Linux)
        if: runner.os == 'Linux'
        working-directory: tools/calibration-helper
        run: |
          pyinstaller --onefile --windowed --name "calibration-helper-GUI" \
            --icon calibration-helper-GUI.ico \
            --hidden-import matplotlib \
            --hidden-import matplotlib.backends.backend_tkagg \
            --hidden-import numpy \
            --hidden-import pyperclipimg \
            --hidden-import PIL \
            --hidden-import tkinter \
            --hidden-import tkinter.ttk \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            --hidden-import tkinter.scrolledtext \
            --add-data "./calibration-helper-GUI.ico:." \
            calibration-helper-GUI.py
        shell: bash

      - name: 🏗️ Build esptool-gui with PyInstaller (Windows)
        if: runner.os == 'Windows'
        working-directory: tools/ESPTools-GUI
        shell: pwsh
        run: |
         $ESPTOOL_LOCATION = $(pip show esptool | findstr '^Location: ').Substring(10).Trim()
          $ESPTOOL_TARGETS_1 = "${ESPTOOL_LOCATION}\esptool\targets\stub_flasher\1\*.json;./esptool/targets/stub_flasher/1/"
          $ESPTOOL_TARGETS_2 = "${ESPTOOL_LOCATION}\esptool\targets\stub_flasher\2\*.json;./esptool/targets/stub_flasher/2/"

          pyinstaller --onefile --windowed --name "esptool-gui" `
            --icon ESPTools-GUI.ico `
            --hidden-import serial.tools.list_ports `
            --hidden-import esptool `
            --hidden-import tkinter `
            --hidden-import tkinter.ttk `
            --hidden-import tkinter.scrolledtext `
            --hidden-import tkinter.filedialog `
            --hidden-import tkinter.messagebox `
            --add-data ".\\ESPTools-GUI.ico;." `
            --add-data "$ESPTOOL_TARGETS_1" `
            --add-data "$ESPTOOL_TARGETS_2" `
            esptool_gui.py

      - name: 🏗️ Build calibration-helper-GUI with PyInstaller (Windows)
        if: runner.os == 'Windows'
        working-directory: tools/calibration-helper
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name "calibration-helper-GUI" `
            --icon calibration-helper-GUI.ico `
            --hidden-import matplotlib `
            --hidden-import matplotlib.backends.backend_tkagg `
            --hidden-import numpy `
            --hidden-import pyperclipimg `
            --hidden-import PIL `
            --hidden-import tkinter `
            --hidden-import tkinter.ttk `
            --hidden-import tkinter.filedialog `
            --hidden-import tkinter.messagebox `
            --hidden-import tkinter.scrolledtext `
            --add-data ".\\calibration-helper-GUI.ico;." `
            calibration-helper-GUI.py

      - name: 🏗️ Build esptool-gui with PyInstaller (macOS .app bundle)
        if: runner.os == 'macOS'
        working-directory: tools/ESPTools-GUI
        run: |
          # On macOS create an onedir .app bundle instead of --onefile
          pip install pillow
          ESPTOOL_LOCATION=$(pip show esptool | grep '^Location: ' | cut -c11- | tr -d '\n') || true
          ESPTOOL_TARGETS_1="${ESPTOOL_LOCATION}/esptool/targets/stub_flasher/1/*.json:./esptool/targets/stub_flasher/1/"
          ESPTOOL_TARGETS_2="${ESPTOOL_LOCATION}/esptool/targets/stub_flasher/2/*.json:./esptool/targets/stub_flasher/2/"

          pyinstaller --windowed --onedir --name "esptool-gui" \
            --icon ESPTools-GUI.ico \
            --hidden-import serial.tools.list_ports \
            --hidden-import esptool \
            --hidden-import tkinter \
            --hidden-import tkinter.ttk \
            --hidden-import tkinter.scrolledtext \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            --add-data "./ESPTools-GUI.ico:." \
            --add-data "${ESPTOOL_TARGETS_1}" \
            --add-data "${ESPTOOL_TARGETS_2}" \
            esptool_gui.py
        shell: bash

      - name: 🏗️ Build calibration-helper-GUI with PyInstaller (macOS .app bundle)
        if: runner.os == 'macOS'
        working-directory: tools/calibration-helper
        run: |
          # On macOS create an onedir .app bundle instead of --onefile
          pyinstaller --windowed --onedir --name "calibration-helper-GUI" \
            --icon calibration-helper-GUI.ico \
            --hidden-import matplotlib \
            --hidden-import matplotlib.backends.backend_tkagg \
            --hidden-import numpy \
            --hidden-import pyperclipimg \
            --hidden-import PIL \
            --hidden-import Quartz \
            --hidden-import tkinter \
            --hidden-import tkinter.ttk \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            --hidden-import tkinter.scrolledtext \
            --add-data "./calibration-helper-GUI.ico:." \
            calibration-helper-GUI.py
        shell: bash

      - name: 📦 Prepare release assets (Linux)
        if: runner.os == 'Linux'
        working-directory: tools
        run: |
          chmod +x dist/esptool-gui
          chmod +x dist/calibration-helper-GUI
          mv dist/esptool-gui esptool-gui-linux-x64
          mv dist/calibration-helper-GUI calibration-helper-GUI-linux-x64

      - name: 📦 Prepare release assets (Windows)
        if: runner.os == 'Windows'
        working-directory: tools
        shell: bash
        run: |
          mv dist/esptool-gui.exe esptool-gui-windows-x64.exe
          mv dist/calibration-helper-GUI.exe calibration-helper-GUI-windows-x64.exe

      - name: 📦 Prepare release assets (macOS .app -> tar.gz)
        if: runner.os == 'macOS'
        working-directory: tools
        run: |
          # macOS produces .app directories — package each as a tar.gz for upload
          tar -C dist -czf esptool-gui-macos-x64.tar.gz "esptool-gui.app"
          tar -C dist -czf calibration-helper-GUI-macos-x64.tar.gz "calibration-helper-GUI.app"

      - name: 📎 Upload executables to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tools/esptool-gui-*
            tools/calibration-helper-*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
