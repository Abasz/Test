name: Build & Attach Firmware to Release

on:
  release:
    types: [created]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build-gui-executables:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_name: esptool-gui
            asset_name: esptool-gui-linux-x64
          - os: windows-latest
            platform: windows
            artifact_name: esptool-gui.exe
            asset_name: esptool-gui-windows-x64.exe
          - os: macos-latest
            platform: macos
            artifact_name: esptool-gui
            asset_name: esptool-gui-macos-x64

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 📦 Install dependencies
        run: |
          pip install pyinstaller pyserial esptool certifi matplotlib numpy pyperclipimg Pillow

      # - name: 📦 Install platform-specific dependencies (Windows)
      #   if: runner.os == 'Windows'
      #   run: |
      #     pip install pywin32

      # - name: 📦 Install platform-specific dependencies (macOS)
      #   if: runner.os == 'macOS'
      #   run: |
      #     pip install pyobjc-framework-quartz

      - name: 🏗️ Build executable with PyInstaller (Linux)
        if: runner.os == 'Linux'
        working-directory: tools
        run: |
          ESPTOOL_LOCATION=$(pip show esptool | grep '^Location: ' | cut -c11- | tr -d '\n')
          ESPTOOL_TARGETS_1="${ESPTOOL_LOCATION}/esptool/targets/stub_flasher/1/*.json:./esptool/targets/stub_flasher/1/"
          ESPTOOL_TARGETS_2="${ESPTOOL_LOCATION}/esptool/targets/stub_flasher/2/*.json:./esptool/targets/stub_flasher/2/"

          pyinstaller --onefile --windowed --name "${{ matrix.artifact_name }}" \
            --hidden-import serial.tools.list_ports \
            --hidden-import esptool \
            --hidden-import tkinter \
            --hidden-import tkinter.ttk \
            --hidden-import tkinter.scrolledtext \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            --add-data "${ESPTOOL_TARGETS_1}" \
            --add-data "${ESPTOOL_TARGETS_2}" \
            esptool_gui.py
        shell: bash

      - name: 🏗️ Build visualize-delta-times with PyInstaller (Linux)
        if: runner.os == 'Linux'
        working-directory: tools
        run: |
          pyinstaller --onefile --windowed --name "visualize-delta-times" \
            --hidden-import matplotlib \
            --hidden-import matplotlib.backends.backend_tkagg \
            --hidden-import numpy \
            --hidden-import pyperclip \
            --hidden-import pyperclipimg \
            --hidden-import PIL \
            --hidden-import tkinter \
            --hidden-import tkinter.ttk \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            --hidden-import tkinter.scrolledtext \
            visualize_delta_times.py
        shell: bash

      - name: 🏗️ Build executable with PyInstaller (Windows)
        if: runner.os == 'Windows'
        working-directory: tools
        shell: pwsh
        run: |
         $ESPTOOL_LOCATION = $(pip show esptool | findstr '^Location: ').Substring(10).Trim()
          $ESPTOOL_TARGETS_1 = "${ESPTOOL_LOCATION}\esptool\targets\stub_flasher\1\*.json;./esptool/targets/stub_flasher/1/"
          $ESPTOOL_TARGETS_2 = "${ESPTOOL_LOCATION}\esptool\targets\stub_flasher\2\*.json;./esptool/targets/stub_flasher/2/"

          pyinstaller --onefile --windowed --name "${{ matrix.artifact_name }}" `
            --hidden-import serial.tools.list_ports `
            --hidden-import esptool `
            --hidden-import tkinter `
            --hidden-import tkinter.ttk `
            --hidden-import tkinter.scrolledtext `
            --hidden-import tkinter.filedialog `
            --hidden-import tkinter.messagebox `
            --add-data "$ESPTOOL_TARGETS_1" `
            --add-data "$ESPTOOL_TARGETS_2" `
            esptool_gui.py

      - name: 🏗️ Build visualize-delta-times with PyInstaller (Windows)
        if: runner.os == 'Windows'
        working-directory: tools
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name "visualize-delta-times" `
            --hidden-import matplotlib `
            --hidden-import matplotlib.backends.backend_tkagg `
            --hidden-import numpy `
            --hidden-import pyperclip `
            --hidden-import pyperclipimg `
            --hidden-import PIL `
            --hidden-import win32clipboard `
            --hidden-import tkinter `
            --hidden-import tkinter.ttk `
            --hidden-import tkinter.filedialog `
            --hidden-import tkinter.messagebox `
            --hidden-import tkinter.scrolledtext `
            visualize_delta_times.py

      - name: 🏗️ Build executable with PyInstaller (macOS .app bundle)
        if: runner.os == 'macOS'
        working-directory: tools
        run: |
          # On macOS create an onedir .app bundle instead of --onefile
          pip install pillow
          ESPTOOL_LOCATION=$(pip show esptool | grep '^Location: ' | cut -c11- | tr -d '\n') || true
          ESPTOOL_TARGETS_1="${ESPTOOL_LOCATION}/esptool/targets/stub_flasher/1/*.json:./esptool/targets/stub_flasher/1/"
          ESPTOOL_TARGETS_2="${ESPTOOL_LOCATION}/esptool/targets/stub_flasher/2/*.json:./esptool/targets/stub_flasher/2/"

          pyinstaller --windowed --onedir --name "${{ matrix.artifact_name }}" \
            --hidden-import serial.tools.list_ports \
            --hidden-import esptool \
            --hidden-import tkinter \
            --hidden-import tkinter.ttk \
            --hidden-import tkinter.scrolledtext \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            --add-data "${ESPTOOL_TARGETS_1}" \
            --add-data "${ESPTOOL_TARGETS_2}" \
            esptool_gui.py
        shell: bash

      - name: 🏗️ Build visualize-delta-times with PyInstaller (macOS .app bundle)
        if: runner.os == 'macOS'
        working-directory: tools
        run: |
          # On macOS create an onedir .app bundle instead of --onefile
          pyinstaller --windowed --onedir --name "visualize-delta-times" \
            --hidden-import matplotlib \
            --hidden-import matplotlib.backends.backend_tkagg \
            --hidden-import numpy \
            --hidden-import pyperclip \
            --hidden-import pyperclipimg \
            --hidden-import PIL \
            --hidden-import Quartz \
            --hidden-import tkinter \
            --hidden-import tkinter.ttk \
            --hidden-import tkinter.filedialog \
            --hidden-import tkinter.messagebox \
            --hidden-import tkinter.scrolledtext \
            visualize_delta_times.py
        shell: bash

      - name: 📦 Prepare release asset (Linux)
        if: runner.os == 'Linux'
        working-directory: tools
        run: |
          chmod +x dist/${{ matrix.artifact_name }}
          chmod +x dist/visualize-delta-times
          mv dist/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          mv dist/visualize-delta-times visualize-delta-times-linux-x64

      - name: ⬆️ Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-linux
          path: |
            tools/${{ matrix.asset_name }}
            tools/visualize-delta-times-linux-x64

      - name: 📦 Prepare release asset (Windows)
        if: runner.os == 'Windows'
        working-directory: tools
        shell: bash
        run: |
          mv dist/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
          mv dist/visualize-delta-times.exe visualize-delta-times-windows-x64.exe

      - name: ⬆️ Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-windows
          path: |
            tools/${{ matrix.asset_name }}
            tools/visualize-delta-times-windows-x64.exe

      - name: 📦 Prepare release asset (macOS .app -> tar.gz)
        if: runner.os == 'macOS'
        working-directory: tools
        run: |
          # macOS produces a <name>.app directory — package it as a tar.gz for upload
          tar -C dist -czf ${{ matrix.asset_name }}.tar.gz "${{ matrix.artifact_name }}.app"
          tar -C dist -czf visualize-delta-times-macos-x64.tar.gz "visualize-delta-times.app"

      - name: ⬆️ Upload artifacts (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}-macos
          path: |
            tools/${{ matrix.asset_name }}.tar.gz
            tools/visualize-delta-times-macos-x64.tar.gz
