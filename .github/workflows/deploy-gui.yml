name: Publish

on:
  release:
    types: [published]

  workflow_dispatch:

  repository_dispatch:
    types: [esp-rowing-monitor-release]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Set up NodeJs
        uses: actions/setup-node@v4

      - name: 🚧 Npm install & Build
        run: |
          npm install
          npm run build -- --base-href=/Test/

      - name: 📎 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist/test/browser/"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: 🌐 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
